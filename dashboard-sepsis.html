<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Statistik Sepsis - Sumba 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #FFF5F8; /* Soft Pink Background senada AppSheet */
  --bg-card: #ffffff;
  --border: rgba(233, 30, 99, 0.12);
  --text-main: #2D3436;
  --text-sub: #636E72;
  
  /* Brand Colors */
  --primary: #E91E63; /* AppSheet Magenta */
  --accent-amber: #f5a623;
  --accent-green: #2ecc71;
  --accent-blue: #3498db;
  --primary-light: #FCE4EC;
  
  --card-radius: 16px;
  --font-title: 'Poppins', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'DM Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text-main);
  font-family: var(--font-body);
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* HEADER */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 10px rgba(233, 30, 99, 0.04);
}

.header-left { display: flex; align-items: center; gap: 14px; }

.logo-img {
  height: 48px;
  object-fit: contain;
}

.header-title {
  font-family: var(--font-title);
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: -0.3px;
}

.header-sub {
  font-size: 11px;
  color: var(--text-sub);
  font-family: var(--font-title);
  font-weight: 500;
}

.header-right { display: flex; align-items: center; gap: 10px; }

.sync-btn, .lang-select {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-card);
  border: 1px solid var(--primary);
  border-radius: 8px;
  padding: 8px 14px;
  color: var(--primary);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font-title);
  transition: all 0.2s;
}
.sync-btn:hover, .lang-select:hover { 
  background: var(--primary); 
  color: white; 
}

.lang-select {
  outline: none;
  padding: 7px 10px;
}

.last-sync {
  font-size: 11px;
  color: var(--text-sub);
  font-family: var(--font-mono);
}

/* MAIN CONTENT */
.main { position: relative; z-index: 1; padding: 24px; max-width: 1200px; margin: 0 auto; display: none; }
.main.visible { display: block; }

.csv-link-info {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 11px;
  color: var(--text-sub);
  font-family: var(--font-body);
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.dot-live {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent-green);
  box-shadow: 0 0 6px var(--accent-green);
  animation: pulse 2s ease infinite;
}

/* LOADING & ERROR */
.loading, .error-box {
  display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 70px); gap: 16px;
}
.spinner {
  width: 40px; height: 40px; border: 3px solid var(--primary-light); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* SECTION LABELS */
.section-label {
  font-size: 12px;
  font-weight: 700;
  font-family: var(--font-title);
  color: var(--primary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 24px 0 14px 0;
  display: flex; align-items: center; gap: 8px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* KPI CARDS */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--card-radius);
  padding: 20px;
  box-shadow: 0 4px 12px rgba(233, 30, 99, 0.02);
  position: relative; overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
  animation: fadeUp 0.4s ease both;
}
.kpi-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(233, 30, 99, 0.06); }
.kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; }
.kpi-card.blue::before { background: var(--accent-blue); }
.kpi-card.red::before { background: var(--primary); }
.kpi-card.amber::before { background: var(--accent-amber); }
.kpi-card.green::before { background: var(--accent-green); }

.kpi-label { font-size: 11px; font-weight: 700; color: var(--text-sub); margin-bottom: 8px; font-family: var(--font-title); }
.kpi-val { font-family: var(--font-title); font-weight: 700; font-size: 38px; line-height: 1; margin-bottom: 4px; }
.kpi-card.blue .kpi-val { color: var(--accent-blue); }
.kpi-card.red .kpi-val { color: var(--primary); }
.kpi-card.amber .kpi-val { color: var(--accent-amber); }
.kpi-card.green .kpi-val { color: var(--accent-green); }
.kpi-sub { font-size: 12px; color: var(--text-sub); }

/* CHARTS */
.chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.chart-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--card-radius); padding: 20px; animation: fadeUp 0.5s ease both; box-shadow: 0 4px 12px rgba(233, 30, 99, 0.02); }
.chart-title { font-family: var(--font-title); font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 2px; }
.chart-sub { font-size: 11px; color: var(--text-sub); margin-bottom: 16px; }
.chart-wrap { position: relative; height: 220px; }

/* RISK FACTORS LAYOUT */
.risk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.risk-factor-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--card-radius); padding: 16px 18px; box-shadow: 0 4px 12px rgba(233, 30, 99, 0.02); }
.rf-label { font-size: 12px; font-weight: 500; color: var(--text-main); margin-bottom: 10px; }
.rf-bar-wrap { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
.rf-bar { height: 100%; border-radius: 4px; transition: width 1s ease-in-out; }
.rf-stats { display: flex; justify-content: space-between; font-size: 11px; font-family: var(--font-mono); }

.footer { text-align: center; padding: 30px; font-size: 12px; color: var(--text-sub); border-top: 1px solid var(--border); margin-top: 40px; font-weight: 500; }

@media (max-width: 600px) {
  .main { padding: 16px; } .header { padding: 0 16px; } .last-sync { display: none; }
  .kpi-grid { grid-template-columns: 1fr 1fr; } .kpi-val { font-size: 28px; }
}
</style>
</head>
